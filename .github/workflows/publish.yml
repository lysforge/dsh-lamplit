name: publish

# 用 npm Trusted Publishing（OIDC）发布：不需要任何长期 token，也不碰 2FA。
# 前提：npmjs.com → 包 → Settings → Trusted Publisher
#   Owner: lysforge   Repository: lamplit   Workflow: publish.yml   Environment: 留空
# 触发：push 一个 v* tag，或在 Actions 页面手动 Run workflow。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted Publishing 需要较新的 npm（会自己走 OIDC 换短期凭证）
      - run: npm install -g npm@latest
      - run: node --test test/*.test.mjs
      - run: npm publish --access public --provenance
